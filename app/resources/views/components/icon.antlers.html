<svg class="{{ class ?? 'h-5 w-5' }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" data-icon="{{ name }}">
    {{ if name == 'arrow' }}
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6" />
    {{ elseif name == 'logo' }}
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12 12 3l9 9-9 9-9-9Z" />
    {{ elseif name == 'calendar' }}
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 3v3m12-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
    {{ elseif name == 'clock' }}
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 2m6-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    {{ else }}
        <circle cx="12" cy="12" r="8" />
    {{ /if }}
</svg>
