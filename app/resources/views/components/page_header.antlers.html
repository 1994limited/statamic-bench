<header class="border-b border-slate-200 bg-gradient-to-b from-slate-50 to-white">
    <div class="mx-auto max-w-7xl px-4 py-12 lg:px-8 lg:py-16">
        {{ if eyebrow }}<p class="mb-2 text-sm font-semibold uppercase tracking-wide text-indigo-600">{{ eyebrow }}</p>{{ /if }}
        {{ partial:components/heading :text="heading ?? title" level="1" size="xl" }}
        {{ if intro }}<p class="mt-4 max-w-2xl text-lg text-slate-600">{{ intro }}</p>{{ /if }}
    </div>
</header>
