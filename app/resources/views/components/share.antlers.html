<aside class="flex items-center gap-3 text-sm text-slate-500">
    <span>Share</span>
    <a href="https://mastodon.example/share?text={{ title | urlencode }}&amp;url={{ permalink | urlencode }}" rel="noopener" class="hover:text-slate-900">Mastodon</a>
    <a href="https://bsky.example/intent/compose?text={{ title | urlencode }}%20{{ permalink | urlencode }}" rel="noopener" class="hover:text-slate-900">Bluesky</a>
    <a href="mailto:?subject={{ title | urlencode }}&amp;body={{ permalink | urlencode }}" class="hover:text-slate-900">Email</a>
</aside>
