<article class="flex gap-4 rounded-xl border border-slate-200 bg-white p-5">
    <div class="flex h-16 w-16 flex-none flex-col items-center justify-center rounded-lg bg-indigo-50 text-indigo-700">
        <span class="text-xl font-bold leading-none">{{ date format="d" }}</span>
        <span class="text-xs uppercase">{{ date format="M y" }}</span>
    </div>
    <div>
        <h3 class="font-semibold"><a href="{{ url }}" class="hover:text-indigo-600">{{ title }}</a></h3>
        <p class="text-sm text-slate-500">{{ venue }}</p>
        <p class="mt-1 text-sm text-slate-600">{{ summary | truncate(110, '…') }}</p>
        {{ if speakers }}
            <p class="mt-2 text-xs text-slate-500">With {{ speakers }}{{ title }}{{ unless last }}, {{ /unless }}{{ /speakers }}</p>
        {{ /if }}
    </div>
</article>
