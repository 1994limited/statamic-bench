{{ if url }}
    <a href="{{ url }}" class="inline-flex items-center justify-center gap-2 rounded-md font-semibold transition {{ size == 'sm' ? 'px-3 py-1.5 text-sm' : 'px-5 py-2.5 text-base' }} {{ style == 'secondary' ? 'border border-slate-300 bg-white text-slate-800 hover:bg-slate-50' : 'bg-indigo-600 text-white hover:bg-indigo-700' }}">
        {{ label }}
        {{ if style != 'secondary' }}{{ partial:components/icon name="arrow" class="h-4 w-4" }}{{ /if }}
    </a>
{{ /if }}
