<article class="flex flex-col rounded-xl border border-slate-200 bg-white p-4">
    {{ gallery limit="1" }}
        <a href="{{ parent:url ?? '#' }}" class="block aspect-square overflow-hidden rounded-lg bg-slate-100">
            <img src="{{ url }}" alt="{{ alt }}" width="{{ width }}" height="{{ height }}" loading="lazy" class="h-full w-full object-cover">
        </a>
    {{ /gallery }}
    <h3 class="mt-4 font-semibold"><a href="{{ url }}">{{ title }}</a></h3>
    <p class="text-xs uppercase tracking-wide text-slate-400">{{ sku }}</p>
    <p class="mt-1 text-sm text-slate-600">{{ summary | truncate(90, '…') }}</p>
    <div class="mt-3 flex items-center justify-between">
        {{ partial:components/price }}
        <span class="text-xs {{ in_stock ? 'text-emerald-600' : 'text-rose-600' }}">{{ in_stock ? 'In stock' : 'Sold out' }}</span>
    </div>
</article>
