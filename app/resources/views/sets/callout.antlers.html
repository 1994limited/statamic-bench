<aside class="not-prose my-8 rounded-lg border p-5 {{ tone == 'warn' ? 'border-amber-300 bg-amber-50' : (tone == 'tip' ? 'border-emerald-300 bg-emerald-50' : 'border-sky-300 bg-sky-50') }}" data-tone="{{ tone }}">
    <p class="font-semibold">{{ label }}</p>
    <p class="mt-1 text-sm">{{ text }}</p>
</aside>
