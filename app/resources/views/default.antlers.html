{{ unless is_homepage }}
    {{ partial:components/page_header }}
{{ /unless }}
{{ partial:partials/blocks }}
{{ if !blocks && children }}
    <div class="mx-auto max-w-7xl px-4 py-12 lg:px-8">
        <ul class="grid gap-4 md:grid-cols-3">
            {{ children }}<li><a href="{{ url }}" class="block rounded-lg border border-slate-200 p-4 hover:bg-slate-50">{{ title }}</a></li>{{ /children }}
        </ul>
    </div>
{{ /if }}
