<section class="border-y border-slate-200 bg-white py-10" data-block="logos">
    <div class="mx-auto max-w-7xl px-4 lg:px-8">
        <p class="text-center text-sm font-semibold uppercase tracking-wide text-slate-500">{{ heading }}</p>
        <ul class="mt-6 flex flex-wrap items-center justify-center gap-x-12 gap-y-6">
            {{ logos }}
                <li><img src="{{ url }}" alt="{{ alt }}" width="{{ width }}" height="{{ height }}" loading="lazy" class="h-8 w-auto opacity-70 grayscale"></li>
            {{ /logos }}
        </ul>
    </div>
</section>
