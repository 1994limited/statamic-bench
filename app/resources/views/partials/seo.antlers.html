{{ if seo_description }}
    <meta name="description" content="{{ seo_description | strip_tags | truncate(155, '…') | entities }}">
{{ elseif excerpt }}
    <meta name="description" content="{{ excerpt | strip_tags | truncate(155, '…') | entities }}">
{{ elseif intro }}
    <meta name="description" content="{{ intro | strip_tags | truncate(155, '…') | entities }}">
{{ else }}
    <meta name="description" content="{{ settings:tagline | entities }}">
{{ /if }}
<meta property="og:site_name" content="{{ settings:site_name }}">
<meta property="og:title" content="{{ seo_title ?? title }}">
<meta property="og:type" content="{{ collection:handle == 'articles' ? 'article' : 'website' }}">
<meta property="og:url" content="{{ permalink }}">
{{ if og_image }}
    <meta property="og:image" content="{{ og_image:permalink }}">
    <meta property="og:image:width" content="{{ og_image:width }}">
    <meta property="og:image:height" content="{{ og_image:height }}">
{{ elseif hero_image }}
    <meta property="og:image" content="{{ hero_image:permalink }}">
{{ /if }}
<meta name="twitter:card" content="summary_large_image">
